[project]
name = "cwmr-etf-replication"
version = "1.0.0"
description = "Replication code for 'Does Online Mean-Reversion Survive Trading Costs? A Reproduction and Pre-Registered Tests on US-Listed ETFs'"
requires-python = ">=3.11"
dependencies = [
    "bidask>=2.1",
    "numpy>=1.26",
    "pandas>=2.1",
    "pandas-market-calendars>=4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cwmr_etf"]
